name: test-publish-subscribe-download

on:
  [ push, pull_request ]
    
jobs:
  test-publish-subscribe-download:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-python@v6
        name: setup Python
        with:
          python-version: '3.12'
      - name: Install pywis-pubsub
        run: |
          pip3 install .
          pip3 install ".[test]"
          pywis-pubsub --version
          pywis-pubsub bundle sync
      - name: run mosquitto container, detached
        run: |
          docker run --rm -d -p 1883:1883 -v $PWD/.github/workflows/test-data/mosquitto.conf:/mosquitto/config/mosquitto.conf --name pywis_pubsub-mqtt eclipse-mosquitto
      - name: run tests
        run: |
          python3 tests/run_tests.py
      - name: subscribe, publish WNM and download associated data without WNM message validation
        run: |
          rm -rf .github/workflows/test-data/*.bufr4
          pywis-pubsub subscribe --config .github/workflows/test-data/wnm/sub-no-msg-validation.yml --download > /tmp/subscribe.log &
          sleep 1
          pywis-pubsub wnm publish --config .github/workflows/test-data/wnm/pub-config.yml -u https://wmostorage.blob.core.windows.net/wmo-public/wmo-information-system/pywis-pubsub-test/WIGOS_0-454-2-AWSCHIKANGAWA_20221109T135500.bufr4 -g 33.8025,-11.8415 -w 0-454-2-AWSCHIKANGAWA
          sleep 1
          less /tmp/subscribe.log
          ls -lh .github/workflows/test-data/origin/a/wis2/mwi/malawi_wmo_demo/data/core/weather/surface-based-observations/synop/WIGOS_0-454-2-AWSCHIKANGAWA_20221109T135500.bufr4
      - name: subscribe, publish WNM and download associated data with WNM message validation
        run: |
          rm -rf .github/workflows/test-data/*.bufr4
          pywis-pubsub subscribe --config .github/workflows/test-data/wnm/sub-with-msg-validation.yml --download > /tmp/subscribe.log &
          sleep 1
          pywis-pubsub wnm publish --config .github/workflows/test-data/wnm/pub-config.yml -u https://wmostorage.blob.core.windows.net/wmo-public/wmo-information-system/pywis-pubsub-test/WIGOS_0-454-2-AWSCHIKANGAWA_20221109T135500.bufr4 -g 33.8025,-11.8415 -w 0-454-2-AWSCHIKANGAWA
          sleep 1
          less /tmp/subscribe.log
          ls -lh .github/workflows/test-data/origin/a/wis2/mwi/malawi_wmo_demo/data/core/weather/surface-based-observations/synop/WIGOS_0-454-2-AWSCHIKANGAWA_20221109T135500.bufr4
      - name: subscribe, publish WNM and download associated data with file-based publication
        run: |
          rm -rf .github/workflows/test-data/*.bufr4
          pywis-pubsub subscribe --config .github/workflows/test-data/wnm/sub-with-msg-validation.yml --download &
          sleep 1
          pywis-pubsub wnm publish --config .github/workflows/test-data/wnm/pub-config.yml --wnm .github/workflows/test-data/wnm/example.json
          sleep 1
          ls -lh .github/workflows/test-data/origin/a/wis2/mwi/malawi_wmo_demo/data/core/weather/surface-based-observations/synop/WIGOS_0-454-2-AWSCHIKANGAWA_20221109T135500.bufr4
      - name: subscribe, publish WMEM with file-based publication
        run: |
          pywis-pubsub wmem publish --config .github/workflows/test-data/wmem/pub-config.yml --wmem .github/workflows/test-data/wmem/example.json
